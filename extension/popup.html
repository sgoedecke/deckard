<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Hider</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><img src="icons/icon.svg" width="24" height="24" alt="">AI Hider</h1>
    <label class="switch"><input id="enabled" type="checkbox" role="switch" aria-label="Enable AI Hider" disabled><span id="toggle-label">Off</span></label>
  </header>
  <label class="threshold-label" for="threshold">Threshold <output id="threshold-value" for="threshold"></output></label>
  <input id="threshold" type="range" min="70" max="99" step="any" aria-label="AI score threshold" title="Lower values mark more passages." disabled>
  <h2 id="page-title">Current page</h2>
  <p id="status" role="status" aria-live="polite">Checking…</p>
  <p id="progress" aria-live="polite"></p>
  <progress id="scan-progress" max="25000" value="0" aria-label="Page scan progress" hidden></progress>
  <section id="results" aria-label="Flagged passages" hidden>
    <h2>Flagged passages</h2>
    <ul id="findings"></ul>
    <p id="navigation-status" role="status" aria-live="polite"></p>
  </section>
  <section id="setup" class="setup" aria-label="Native helper setup" hidden>
    <h2>Native helper setup</h2>
    <p class="hint">Run once from the project folder, then reload this extension and your pages:</p>
    <p><code id="install-command"></code></p>
    <p class="hint">Extension ID: <code id="extension-id"></code></p>
  </section>
  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>

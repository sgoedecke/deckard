name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension and release tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Core ML
            os: macos-15
            manifest: native-cli/model-assets.json
          - name: Linux Candle
            os: ubuntu-24.04
            manifest: native-cli/model-assets-linux.json
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev zsh
      - name: Cache native build dependencies
        uses: actions/cache@v4
        with:
          path: cache/native-build
          key: native-deps-${{ runner.os }}-${{ hashFiles('native-cli/bootstrap*.sh', 'native-cli/tokenizer/Cargo.lock', 'native-cli/candle/Cargo.lock') }}
      - name: Build
        run: scripts/build-native.sh
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deckard-model
          key: model-${{ runner.os }}-${{ hashFiles(matrix.manifest) }}
      - name: Fetch pinned model
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-fetch-model.sh "$RUNNER_TEMP/deckard-model"
      # Linux also runs the ONNX Runtime tests on model.onnx, which nobody
      # publishes: CI exports it once from the checkpoint and caches it.
      - name: Cache model.onnx
        id: onnx-cache
        if: runner.os == 'Linux' && steps.model.outputs.model_dir
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deckard-model-onnx/model.onnx
          key: onnx-${{ hashFiles('native-cli/model-assets-onnx.json', 'native-cli/model-assets-linux.json', 'native-cli/onnx/**') }}
      - name: Set up Python for the model.onnx export
        if: runner.os == 'Linux' && steps.model.outputs.model_dir && steps.onnx-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Export pinned model.onnx
        id: onnx
        if: runner.os == 'Linux' && steps.model.outputs.model_dir
        env:
          CHECKPOINT: ${{ steps.model.outputs.model_dir }}
        run: |
          out="$RUNNER_TEMP/deckard-model-onnx"
          mkdir -p "$out"
          ln -f "$CHECKPOINT/config.json" "$CHECKPOINT/model.safetensors" "$CHECKPOINT/tokenizer.json" "$out/"
          scripts/export-onnx.sh "$out"
          echo "model_dir=$out" >> "$GITHUB_OUTPUT"
      - name: Native tests
        env:
          DECKARD_MODEL_DIR: ${{ steps.onnx.outputs.model_dir || steps.model.outputs.model_dir }}
        run: npm run test:native
